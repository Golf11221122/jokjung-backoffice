<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎯 KPI & Targets | JOKJUNG Back Office</title><link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/stock-v2.css"><style>.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.formgrid input,.formgrid select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}.bar{height:9px;background:#eee;border-radius:9px;overflow:hidden}.fill{height:100%;background:#f8b900}.pill{padding:3px 8px;border-radius:12px;font-weight:700}.green{background:#e8f6ec;color:#18763a}.yellow{background:#fff4cc;color:#8a6500}.red{background:#fde9e7;color:#b3261e}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee}.num{text-align:right}@media(max-width:900px){.grid,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.formgrid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="sidebar"><div class="sidebar-brand"><strong>JOKJUNG</strong><small>Back Office</small></div><nav><div class="nav-section"><div class="nav-title">ภาพรวม</div><a class="nav-link" href="../dashboard.html">📊 Dashboard</a><a class="nav-link active" href="./kpi-targets.html">🎯 KPI & Targets</a></div><div class="nav-section"><div class="nav-title">FINANCE</div><a class="nav-link" href="./expenses.html">🧾 ค่าใช้จ่าย</a><a class="nav-link" href="./pnl.html">📈 P&L</a><a class="nav-link" href="./reconciliation.html">💳 กระทบยอดการขาย</a></div><div class="nav-section"><div class="nav-title">STOCK & COST</div><a class="nav-link" href="../stock/cost-control.html">💰 Cost Control</a></div></nav></aside><div class="main"><header class="topbar"><div class="topbar-left"><div><h1>🎯 KPI & Targets</h1><p id="branchText">-</p></div></div><div class="user-box"><span id="userName">-</span><span id="roleBadge" class="role-pill">-</span><button id="logoutBtn" class="outline-btn">ออกจากระบบ</button></div></header><main class="content"><div class="page-head"><div><h2>KPI & Target Management</h2><p>กำหนดเป้าหมายรายวัน • สัปดาห์ • เดือน • ไตรมาส • ปี</p></div><button id="newBtn" class="primary-btn">+ ตั้งเป้าหมาย</button></div><section class="grid" id="summary"></section><section class="panel"><div class="formgrid"><select id="filterPeriod"><option value="">ทุกช่วงเวลา</option><option value="daily">รายวัน</option><option value="weekly">รายสัปดาห์</option><option value="monthly">รายเดือน</option><option value="quarterly">รายไตรมาส</option><option value="yearly">รายปี</option></select><input id="search" placeholder="ค้นหา KPI..."><button id="refreshBtn" class="outline-btn">↻ รีเฟรช</button></div></section><section class="panel"><div style="overflow:auto"><table><thead><tr><th>หมวด</th><th>KPI</th><th>ช่วง</th><th class="num">เป้าหมาย</th><th>หลักการ</th><th>เตือน</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><dialog id="dlg"><form id="form" method="dialog" style="min-width:min(820px,90vw)"><h3>ตั้งเป้าหมาย KPI</h3><div class="formgrid"><select id="preset"></select><input id="code" placeholder="KPI Code" required><input id="name" placeholder="ชื่อ KPI" required><input id="category" placeholder="หมวด" required><select id="period"><option value="daily">รายวัน</option><option value="weekly">รายสัปดาห์</option><option value="monthly" selected>รายเดือน</option><option value="quarterly">รายไตรมาส</option><option value="yearly">รายปี</option></select><input id="start" type="date" required><input id="end" type="date" required><input id="target" type="number" step="0.01" placeholder="เป้าหมาย" required><select id="unit"><option value="THB">บาท</option><option value="PERCENT">%</option><option value="COUNT">จำนวน</option><option value="RATIO">อัตราส่วน</option></select><select id="direction"><option value="higher_better">ยิ่งสูงยิ่งดี</option><option value="lower_better">ยิ่งต่ำยิ่งดี</option><option value="target_range">อยู่ในช่วงเป้าหมาย</option></select><input id="tol" type="number" value="10" step="0.1" placeholder="Warning tolerance %"><input id="min" type="number" step="0.01" placeholder="ค่าต่ำสุด (Range)"><input id="max" type="number" step="0.01" placeholder="ค่าสูงสุด (Range)"><input id="note" placeholder="หมายเหตุ"></div><p id="msg"></p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:15px"><button type="button" id="cancel" class="outline-btn">ยกเลิก</button><button class="primary-btn">บันทึก</button></div></form></dialog></main></div></div><script type="module" src="../js/kpi-targets.js"></script></body></html>
