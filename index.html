<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS</title>

    <link rel="stylesheet" href="./css/login.css">

    <script type="module" src="./js/auth.js?v=2.9.2"></script>
</head>

<body>

    <div class="login-box">

        <h1>JOKJUNG POS</h1>
        <p>ระบบจัดการร้านอาหาร</p>

        <input type="email" id="email" placeholder="อีเมล">

        <input type="password" id="password" placeholder="รหัสผ่าน">

        <button id="loginBtn">
            เข้าสู่ระบบ
        </button>

        <!--
            V2.9.2
            เก็บ element ไว้เพื่อไม่ให้ auth.js เดิม error
            แต่ปิดการสมัครสมาชิกจากหน้า Login สาธารณะ
        
        <button
            id="signupBtn"
            type="button"
            hidden
            disabled
            aria-hidden="true"
            tabindex="-1"
        >
            สมัครสมาชิก
        </button>-->

        <p
            style="
                margin:12px 0 0;
                color:#777;
                font-size:13px;
                text-align:center;
            "
        >
            บัญชีพนักงานสร้างโดยผู้ดูแลระบบ
        </p>

        <p id="message"></p>

    </div>

</body>

</html>
